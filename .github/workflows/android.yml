# Собирает Android-приложение (APK) — обёртку над сайтом (Trusted Web Activity).
# Запускается при изменении папки android/ или вручную: Actions → «Android-приложение» → Run workflow.
# Ключ подписи хранится в секретах репозитория: KS_B64 (файл .jks в base64) и KS_PASS (пароль).
# Готовый файл кладётся в корень сайта: hasanatiki.apk (кнопка «Скачать приложение»).
name: Android-приложение
on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Ключ подписи
        id: ks
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::warning::Нет секрета KS_B64 — сборка пропущена. Добавьте ключ: Settings → Secrets and variables → Actions"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Сборка APK
        if: steps.ks.outputs.skip != '1'
        env:
          KS_PATH: ${{ runner.temp }}/release.jks
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Проверка подписи
        if: steps.ks.outputs.skip != '1'
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | head -5
          cp "$APK" hasanatiki.apk
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        if: steps.ks.outputs.skip != '1'
        with:
          name: hasanatiki-apk
          path: hasanatiki.apk
      - name: Выложить на сайт
        if: steps.ks.outputs.skip != '1'
        run: |
          git config user.name "hasanatiki-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f hasanatiki.apk
          git diff --cached --quiet && echo "APK не изменился" && exit 0
          git commit -m "Android-приложение: сборка ${{ github.run_number }}"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done; exit 1
