# Временный: образцы голосов Silero (CC BY-NC 4.0) с ударениями из словаря
name: Образцы голосов
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/tts_try.yml"]
permissions:
  contents: write
concurrency: { group: ttstry, cancel-in-progress: true }
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Синтез
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy omegaconf scipy
          mkdir -p tts_samples
          python3 - <<'PY'
          import torch, wave, numpy as np, subprocess
          T=("Асс+алямалейк+ум, Ибрах+им! Сегодня у нас урок про омовение. "
             "Нарушает ли омовение поход в туалет? Варианты: первый — нет, втор+ой — да. "
             "Машалл+ах, верно! Ты молодец, так держать!")
          def save(a,sr,name):
              a=(np.clip(a,-1,1)*32767).astype(np.int16)
              w=wave.open('/tmp/x.wav','wb');w.setnchannels(1);w.setsampwidth(2);w.setframerate(sr);w.writeframes(a.tobytes());w.close()
              subprocess.run(['ffmpeg','-y','-loglevel','error','-i','/tmp/x.wav','-b:a','64k','tts_samples/'+name+'.mp3'],check=True)
          model,_=torch.hub.load('snakers4/silero-models','silero_tts',language='ru',speaker='v5_ru',trust_repo=True)
          for sp in ['baya','kseniya','xenia','aidar','eugene']:
              a=model.apply_tts(text=T,speaker=sp,sample_rate=48000,put_accent=True,put_yo=True)
              save(a.numpy(),48000,'v5_ru_'+sp)
          PY
          ls -la tts_samples
      - name: Сохранить в ветку samples
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git checkout -q --orphan samples; git rm -rqf --cached . ; git add tts_samples; git commit -qm "Образцы голосов"; git push -qf origin samples
