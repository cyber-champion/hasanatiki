# Разовая проверка: есть ли тайминги слов для чтения аль-Хусари (quran.com API)
name: Тайминги слов — проверка
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/seg_probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS "https://api.quran.com/api/v4/resources/recitations?language=en" | python3 -c "import json,sys;[print(r['id'],r.get('reciter_name'),r.get('style')) for r in json.load(sys.stdin)['recitations']]"
          for id in 5 6 12; do echo "== $id"; curl -sS "https://api.quran.com/api/v4/recitations/$id/by_chapter/112?segments=true" | head -c 900; echo; done
          echo "== qul"; curl -sSI "https://qul.tarteel.ai/resources/recitation" | head -5
