# Скачивает записи азана/икамата со свободной лицензией (Викисклад) в ветку azan-src для выбора.
name: Азан — кандидаты
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/azan_get.yml"]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Скачать
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p cand; U="hasanatiki-bot/1.0 (education app; contact via github)"
          get(){ n=$1; url=$2; sleep 4; curl -sSfL -A "$U" --retry 4 --retry-delay 10 -o "src_$n" "$url" && ffmpeg -loglevel error -y -i "src_$n" -vn -ac 1 -ar 44100 -b:a 96k "cand/$n.mp3" && echo "OK $n $(ffprobe -v error -show_entries format=duration -of csv=p=0 cand/$n.mp3)s" || echo "FAIL $n"; rm -f "src_$n"; }
          C=https://upload.wikimedia.org/wikipedia/commons
          get a1_azan_Andrewler "$C/8/86/Azan.ogg"
          get a2_beautiful_cc0 "$C/b/b0/Beautiful_adhan.ogg"
          get a3_adhan_cc0 "$C/e/e7/Adhan.ogg"
          get a4_aaqib_azeez "$C/7/7d/The_Adhan_-_Muslim_Call_to_Prayer_-_Aaqib_Azeez.mp3"
          get a5_sabah_fakhry "$C/2/27/Call_to_prayer_by_Sabah_Fakhry.mp3"
          get i1_iqama_ramadan "$C/4/43/Iqama_during_Ramadan.wav"
          get f1_fajr_malmo "$C/$(python3 -c "import hashlib;n='Eid_al-Fitr_Fajr_azan_at_Malmö_Mosque_-_19_August_2012.webm';h=hashlib.md5(n.encode()).hexdigest();print(h[0]+'/'+h[:2]+'/'+n)")"
          get a6_mecca_2013 "$C/a/a7/Adhan%2C_Great_Mosque_of_Mecca_-_Jan_21%2C_2013.webm"
          ls -la cand
      - name: В ветку azan-src
        run: |
          git config user.name "hasanatiki-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan azan-src; git rm -rfq . ; git add cand; git commit -qm "Кандидаты азана (Викисклад)"; git push -f origin azan-src
