name: Сборка голосов уроков

on:
  push:
    branches: [voice-build]
    paths:
      - .github/workflows/build-voice-pack.yml
      - tools/build-voices.py
      - voice-lines.json
      - voice-probes.json

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Подготовить локальный синтез
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1
          python -m pip install --no-deps silero-stress==1.5 lameenc==1.9.0 numpy==2.2.6
          curl --fail --location --silent --show-error 'https://models.silero.ai/models/tts/ru/v5_cis_base_nostress.pt' -o "$RUNNER_TEMP/silero.pt"
      - name: Озвучить уроки
        run: python tools/build-voices.py --root . --model "$RUNNER_TEMP/silero.pt"
      - name: Проверить пакет
        run: node tools/verify-release.cjs
      - name: Сохранить готовые записи
        run: |
          git config user.name "hasanatiki-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- voice-pack.js offline-pack.json audio/voice
          git diff --cached --quiet || git commit -m "Собрать голоса Дмитрия и Екатерины"
          git push origin HEAD:voice-build
