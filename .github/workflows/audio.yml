# Скачивает два варианта чтения шейха аль-Хусари: audio/h — обучающее (Муаллим), audio/hm — обычное (мураттал).
# Однократно скачивает обучающее чтение шейха аль-Хусари (Муаллим, everyayah.com / зеркало quranicaudio)
# для Аль-Фатихи, Аят аль-Курси и 30-го джуза (суры 78–114), по одному файлу на аят,
# переводит в моно 64 кбит/с (в 2 раза легче) и кладёт в папку audio/h/.
# Запускается сам при изменении этого файла, или вручную: Actions → «Аудио сур» → Run workflow.
name: Аудио сур
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/audio.yml"]
permissions:
  contents: write
concurrency:
  group: audio
  cancel-in-progress: true
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Скачать и сжать
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p audio/h tmp
          list="002255"
          add() { s=$1; n=$2; for a in $(seq 1 $n); do list="$list $(printf '%03d%03d' $s $a)"; done; }
          add 1 7
          for p in 67:30 68:52 69:52 70:44 71:28 72:28 73:20 74:56 75:40 76:31 77:50 78:40 79:46 80:42 81:29 82:19 83:36 84:25 85:22 86:17 87:19 88:26 89:30 90:20 91:15 92:21 93:11 94:8 95:8 96:19 97:5 98:8 99:8 100:11 101:11 102:8 103:3 104:9 105:5 106:4 107:7 108:3 109:6 110:3 111:5 112:4 113:5 114:6; do add ${p%:*} ${p#*:}; done
          get() { src=$1; dir=$2; mkdir -p $dir; n=0
          for f in $list; do
            [ -s $dir/$f.mp3 ] && continue
            curl -sSfL --connect-timeout 20 --retry 3 --retry-delay 3 -o tmp/$f.mp3 "https://mirrors.quranicaudio.com/everyayah/$src/$f.mp3" \
              || curl -sSfL --connect-timeout 20 --retry 3 --retry-delay 3 -o tmp/$f.mp3 "https://everyayah.com/data/$src/$f.mp3"
            ffmpeg -loglevel error -y -i tmp/$f.mp3 -map_metadata -1 -ac 1 -ar 44100 -b:a 64k $dir/$f.mp3
            n=$((n+1))
          done
          echo "$dir: новых файлов $n, всего $(ls $dir | wc -l)"; du -sh $dir; }
          get Husary_Muallim_128kbps audio/h
          get Husary_128kbps audio/hm
          rm -rf tmp
          echo "Новых файлов: $n"; ls audio/h | wc -l; du -sh audio/h
      - name: Сохранить в репозиторий
        run: |
          git config user.name "hasanatiki-bot"
          git config user.email "actions@users.noreply.github.com"
          git add audio
          git diff --cached --quiet && echo "Нечего сохранять" && exit 0
          git commit -m "Аудио: аль-Хусари — Аль-Фатиха, Аят аль-Курси, 29-й и 30-й джуз"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done; exit 1
