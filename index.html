:root{

  background-repeat:no-repeat}

.btn{border:0;border-radius:14px;padding:10px 14px;background:#2a3566;color:var(--tx);cursor:pointer;font-weight:800;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none}

.s-oct{transform-origin:100px 100px;animation:s-in .7s cubic-bezier(.2,1.4,.4,1) both,s-spin 9s linear .7s infinite}
.s-halo{transform-origin:100px 100px;animation:s-halo 2.4s ease-in-out infinite}
.s-moon{transform-origin:100px 100px;animation:s-in .6s .15s cubic-bezier(.2,1.4,.4,1) both}
.s-tw{transform-box:fill-box;transform-origin:center;animation:s-tw 1.6s ease-in-out infinite}
.s-sp{transform-box:fill-box;transform-origin:center;animation:s-sp 2s ease-in-out infinite}
.s-shoot{animation:s-shoot 2.2s .9s ease-in infinite}
@keyframes s-in{from{transform:scale(.4) rotate(-90deg);opacity:0}}
@keyframes s-spin{to{transform:rotate(360deg)}}
@keyframes s-halo{50%{opacity:.9;transform:scale(1.12)}}
@keyframes s-tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.15;transform:scale(.5)}}
@keyframes s-sp{0%,100%{opacity:1;transform:scale(1) rotate(0)}50%{opacity:.35;transform:scale(.6) rotate(45deg)}}
@keyframes s-shoot{0%{transform:translate(0,0);opacity:0}10%{opacity:1}40%{transform:translate(-70px,45px);opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.s-oct,.s-halo,.s-moon,.s-tw,.s-sp,.s-shoot{animation:none}.splash .snm,.splash .ssb{animation:none;opacity:1}}

.lnode .lt{font-size:12px;font-weight:800;line-height:1.15;text-align:center;background:var(--night);padding:1px 4px;border-radius:6px}.lnode .ls{font-size:11px;letter-spacing:1px;min-height:12px}

.lsab b{position:absolute;left:50%;bottom:100%;transform:translateX(calc(-50% + var(--bx,0px))) scale(0);transform-origin:calc(50% - var(--bx,0px)) 100%;background:#fff;color:#1F2340;font-size:12px;font-weight:900;padding:4px 8px;border-radius:12px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18);transition:transform .2s;pointer-events:none}.lsab.say b{transform:translateX(calc(-50% + var(--bx,0px))) scale(1)}.lsab.low b{bottom:auto;top:100%;transform-origin:calc(50% - var(--bx,0px)) 0}
.sic2{position:relative;width:100%;height:100%;border-radius:22%;overflow:hidden;background:radial-gradient(circle at 30% 25%,#7C9BFF 0%,#4F46E5 60%,#3B2FC0 100%);box-shadow:0 18px 40px rgba(59,47,192,.35)}
.sic2>svg{position:absolute;inset:0;width:100%;height:100%}
.s-bee{animation:sbee 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes sbee{50%{transform:translate(-2px,2px) rotate(-8deg)}}
.sic2 i{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;opacity:.8}
html[data-theme] .splash{background:var(--night)}html[data-theme] .splash .snm{color:var(--brand)}html[data-theme] .splash .ssb{color:var(--mut)}

.abopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.abopts .lopt{margin:0;text-align:center;padding:10px 6px;min-height:64px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
html[data-theme] .abopts .lopt.ar{font-size:40px;text-align:center;line-height:1.3}
.abq{text-align:center;font-size:64px!important;line-height:1.5!important;padding:6px 0;margin:4px 0 12px;background:var(--card2);border-radius:18px}
.abcard{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.abl{font-size:56px!important;line-height:1.3!important;min-width:70px;text-align:center;background:var(--soft);border-radius:18px;padding:2px 8px}
.abf{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;direction:rtl}.abf span{display:flex;flex-direction:column;align-items:center;background:var(--card2);border-radius:12px;padding:2px 8px}
.abf i{font-style:normal;font-size:26px;line-height:1.5}.abf small{font-size:10px;color:var(--mut);direction:ltr}
.abgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}.abc{display:flex;flex-direction:column;align-items:center;background:var(--card2);border-radius:16px;padding:8px}.abc small{color:var(--mut)}
.abrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:34px;margin:8px 0}.abg{font-size:38px;background:var(--qbg);border-radius:12px;padding:0 10px}
button.sj{border:0;font:inherit;font-weight:800;cursor:pointer}.sj.cur{box-shadow:0 0 0 2px var(--q) inset}

html[data-theme] .st{border-radius:18px;padding:12px 6px;box-shadow:0 4px 0 rgba(0,0,0,.06);border:2px solid transparent}
html[data-theme] .st b{font-size:30px;line-height:1.1}
html[data-theme] .st span{color:var(--tx);font-size:13px;font-weight:800}
.st:has(b[style*="var(--n)"]){background:var(--nbg);border-color:color-mix(in srgb,var(--n) 30%,transparent)!important}
.st:has(b[style*="var(--q)"]){background:var(--qbg);border-color:color-mix(in srgb,var(--q) 30%,transparent)!important}
.st:has(b[style*="var(--x)"]){background:var(--xbg);border-color:color-mix(in srgb,var(--x) 30%,transparent)!important}
.st:has(b[style*="var(--f)"]){background:var(--fbg);border-color:color-mix(in srgb,var(--f) 30%,transparent)!important}
.st:has(b[style*="var(--gold)"]){background:linear-gradient(135deg,#FFB547,#FF7A45);box-shadow:0 4px 0 #D9622E!important}
.st:has(b[style*="var(--gold)"]) b,.st:has(b[style*="var(--gold)"]) span{color:#fff!important}

.lnode.big .ln{width:84px;height:84px;background:var(--nc);border:4px solid #fff;color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--nc) 65%,#000),0 8px 18px rgba(0,0,0,.15);position:relative}
html[data-theme=dark] .lnode.big .ln{border-color:rgba(255,255,255,.85)}

.lnode.big .ln u{position:absolute;left:-6px;top:-6px;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--nc);font:900 14px/28px var(--font);font-family:var(--font)!important;direction:ltr;text-align:center;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.lnode.big.done .ln{background:var(--nc);border-color:#BBF7D0}.lnode.big.done .ln u{background:#22C55E;color:#fff}
.lnode.big.cur .ln{width:94px;height:94px;background:var(--nc);border-color:#FFE3C2;animation:lpulse 1.6s ease-in-out infinite}
.lnode.big .lt{font-size:13px;margin-top:6px;padding:2px 8px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
.lspark{position:absolute;opacity:.8;animation:s-tw 2.4s ease-in-out infinite}
.lnode:not(.big):not(.done):not(.cur) .ln{border-color:var(--nc,var(--brand));color:var(--nc,var(--brand))}

var PUSH_FN="// Хасанатики — отправка пуш-уведомлений.\n// Supabase → Edge Functions → новая функция с именем «push» → вставить этот код → Deploy.\n// Секреты (Edge Functions → Secrets): VAPID_PUBLIC, VAPID_PRIVATE, PUSH_SECRET — их создаёт Кабинет → «Пуш-уведомления».\nimport webpush from \"npm:web-push@3.6.7\";\n\nconst cors = {\n  \"Access-Control-Allow-Origin\": \"*\",\n  \"Access-Control-Allow-Headers\": \"apikey, authorization, content-type, x-client-info\",\n  \"Access-Control-Allow-Methods\": \"POST, OPTIONS\",\n};\nconst json = (o: unknown, status = 200) =>\n  new Response(JSON.stringify(o), { status, headers: { ...cors, \"Content-Type\": \"application/json\" } });\n\nDeno.serve(async (req) => {\n  if (req.method === \"OPTIONS\") return new Response(\"ok\", { headers: cors });\n  const pub = Deno.env.get(\"VAPID_PUBLIC\"), priv = Deno.env.get(\"VAPID_PRIVATE\"), secret = Deno.env.get(\"PUSH_SECRET\");\n  if (!pub || !priv || !secret) return json({ error: \"Не заданы секреты VAPID_PUBLIC, VAPID_PRIVATE, PUSH_SECRET\" }, 500);\n  webpush.setVapidDetails(Deno.env.get(\"VAPID_SUBJECT\") || \"https://hasanatiki.netlify.app\", pub, priv);\n  const base = Deno.env.get(\"SUPABASE_URL\")!;\n  const key = req.headers.get(\"apikey\") || Deno.env.get(\"SUPABASE_ANON_KEY\") || \"\";\n  const rpc = async (fn: string, args: unknown) => {\n    const h: Record<string, string> = { apikey: key, \"Content-Type\": \"application/json\" };\n    if (key.startsWith(\"eyJ\")) h.Authorization = \"Bearer \" + key;\n    const r = await fetch(`${base}/rest/v1/rpc/${fn}`, { method: \"POST\", headers: h, body: JSON.stringify(args) });\n    const body = await r.json().catch(() => null);\n    if (!r.ok) throw new Error((body && body.message) || \"http \" + r.status);\n    return body;\n  };\n  try {\n    const list = (await rpc(\"push_take\", { p_secret: secret })) as Array<{ endpoint: string; p256dh: string; auth: string; payload: unknown }>;\n    const gone: string[] = [], errors: string[] = [];\n    let sent = 0, failed = 0;\n    await Promise.all(list.map(async (m) => {\n      try {\n        await webpush.sendNotification({ endpoint: m.endpoint, keys: { p256dh: m.p256dh, auth: m.auth } }, JSON.stringify(m.payload), { TTL: 86400 });\n        sent++;\n      } catch (e) {\n        const err = e as { statusCode?: number; body?: string; message?: string };\n        if (err.statusCode === 404 || err.statusCode === 410) gone.push(m.endpoint);\n        else { failed++; if (errors.length < 3) errors.push(((err.statusCode ? err.statusCode + \" \" : \"\") + (err.body || err.message || String(e))).slice(0, 200)); }\n      }\n    }));\n    if (gone.length) await rpc(\"push_gone\", { p_secret: secret, p_endpoints: gone });\n    return json({ ok: true, version: 2, total: list.length, sent, failed, removed: gone.length, errors });\n  } catch (e) {\n    return json({ error: String((e as Error).message || e) }, 500);\n  }\n});\n";

GC.h4={n:"40 хадисов ан-Навави",sub:"полный сборник имама ан-Навави",ic:"📗",col:"#0284C7",les:[{"t": "Намерение и вера", "ic": "🎯", "tip": "Хадисы № 1–4 из сборника имама ан-Навави.", "c": [["🎯", "Хадис № 1", "«Поистине, дела оцениваются по намерениям, и каждому человеку — то, что он намеревался». (аль-Бухари, Муслим)"], ["👁", "Хадис № 2", "Джибриль пришёл в образе человека и спросил об исламе, имане и ихсане. Пророк ﷺ ответил: ислам — свидетельствовать, что нет божества, кроме Аллаха, и что Мухаммад — посланник Аллаха, совершать намаз, давать закят, поститься в Рамадан и совершить хадж; иман — верить в Аллаха, Его ангелов, Писания, посланников, Последний день и предопределение — его добро и зло; ихсан — поклоняться Аллаху так, будто видишь Его, ведь если ты не видишь Его, то Он видит тебя. (Муслим)"], ["🕌", "Хадис № 3", "«Ислам построен на пяти: свидетельстве, что нет божества, кроме Аллаха, и что Мухаммад — посланник Аллаха, совершении намаза, выплате закята, хадже к Дому и посте в Рамадан». (аль-Бухари, Муслим)"], ["👶", "Хадис № 4", "Пророк ﷺ рассказал, что человек сорок дней формируется в утробе матери, затем проходит другие стадии, а потом Аллах посылает ангела, который вдувает в него душу и записывает четыре вещи: его удел, срок жизни, дела и будет ли он несчастным или счастливым. (аль-Бухари, Муслим)"]], "q": [["Чем оцениваются дела?", ["Намерениями", "Количеством", "Тем, кто их видел"], 0, "Хадис № 1."], ["Кто пришёл в образе человека и спрашивал Пророка ﷺ?", ["Джибриль", "Абу Бакр", "Микаиль"], 0, "Хадис № 2."], ["Сколько столпов ислама?", ["Пять", "Шесть", "Три"], 0, "Хадис № 3."], ["Сколько вещей записывает ангел о человеке ещё до рождения?", ["Четыре", "Две", "Десять"], 0, "Удел, срок, дела, счастье или несчастье."]]}, {"t": "Новшества и сердце", "ic": "🚫", "tip": "Хадисы № 5–6 из сборника имама ан-Навави.", "c": [["🚫", "Хадис № 5", "«Кто внесёт в это наше дело (в религию) то, что к нему не относится, — это будет отвергнуто». (аль-Бухари, Муслим)"], ["❤️", "Хадис № 6", "«Дозволенное ясно, и запретное ясно, а между ними — сомнительное, которого многие люди не знают. Кто остерегается сомнительного, тот бережёт свою веру и честь… Поистине, в теле есть кусочек плоти: если он хорош — хорошо всё тело, а если испорчен — испорчено всё тело. Это — сердце». (аль-Бухари, Муслим)"]], "q": [["Что будет с новшеством, добавленным в религию?", ["Оно отвергается", "Оно принимается", "За него награда"], 0, "Хадис № 5."], ["Какой «кусочек плоти» делает хорошим всё тело?", ["Сердце", "Язык", "Рука"], 0, "Хадис № 6."], ["Как поступать с сомнительным?", ["Остерегаться его", "Делать без раздумий", "Спорить о нём"], 0, "Хадисы № 6 и 11."]]}, {"t": "Искренность и запреты", "ic": "🤝", "tip": "Хадисы № 7–9 из сборника имама ан-Навави.", "c": [["🤝", "Хадис № 7", "«Религия — это искренность (насыха)». Спросили: «По отношению к кому?» Он ответил: «К Аллаху, Его Книге, Его посланнику, к руководителям мусульман и ко всем мусульманам». (Муслим)"], ["🛡", "Хадис № 8", "Пророк ﷺ сказал, что тот, кто свидетельствует, что нет божества, кроме Аллаха, и что Мухаммад — посланник Аллаха, совершает намаз и даёт закят, — тот защитил свою жизнь и имущество, а его расчёт — у Аллаха. (Смысл: шахада, намаз и закят — знаки мусульманина, его кровь и имущество неприкосновенны.) (аль-Бухари, Муслим)"], ["📏", "Хадис № 9", "«От чего я вам запретил — сторонитесь этого, а что я вам велел — делайте, насколько сможете. Поистине, тех, кто был до вас, погубили многочисленные вопросы и разногласия с их пророками». (аль-Бухари, Муслим)"]], "q": [["«Религия — это…»", ["искренность (насыха)", "строгость", "традиция"], 0, "Хадис № 7."], ["Что велено делать с повелениями Пророка ﷺ?", ["Делать, насколько сможешь", "Делать только легкие", "Обсуждать без конца"], 0, "Хадис № 9."], ["Что погубило прежние народы?", ["Многочисленные вопросы и споры с пророками", "Бедность", "Холод"], 0, "Хадис № 9."]]}, {"t": "Благое и сомнения", "ic": "🌿", "tip": "Хадисы № 10–12 из сборника имама ан-Навави.", "c": [["🌿", "Хадис № 10", "«Поистине, Аллах Благ и принимает только благое». Затем он упомянул человека в долгом пути, растрёпанного и пыльного, который поднимает руки к небу и просит, но его еда, питьё и одежда — из запретного. Как же ответить ему? (Муслим)"], ["⚖️", "Хадис № 11", "«Оставь то, что вызывает у тебя сомнение, ради того, что не вызывает у тебя сомнения». (ат-Тирмизи, ан-Насаи)"], ["🔇", "Хадис № 12", "«Из совершенства ислама человека — оставление того, что его не касается». (ат-Тирмизи)"]], "q": [["Что Аллах принимает?", ["Только благое", "Всё подряд", "Только дорогое"], 0, "Хадис № 10."], ["Как поступать, если сомневаешься?", ["Оставить сомнительное", "Сделать на всякий случай", "Спросить у незнакомца"], 0, "Хадис № 11."], ["Из совершенства ислама — оставлять…", ["то, что тебя не касается", "намаз", "родителей"], 0, "Хадис № 12."]]}, {"t": "Брат и сосед", "ic": "🤲", "tip": "Хадисы № 13–15 из сборника имама ан-Навави.", "c": [["🤲", "Хадис № 13", "«Не уверует никто из вас по-настоящему, пока не будет желать своему брату того же, чего желает себе». (аль-Бухари, Муслим)"], ["🩸", "Хадис № 14", "«Кровь мусульманина неприкосновенна, кроме трёх случаев», которые Пророк ﷺ перечислил: это тяжкие преступления, наказание за которые выносит только законный суд, а не люди сами. (Смысл: жизнь человека священна.) (аль-Бухари, Муслим)"], ["🗣", "Хадис № 15", "«Кто верует в Аллаха и в Последний день, пусть говорит благое или молчит. Кто верует в Аллаха и в Последний день, пусть оказывает уважение соседу. Кто верует в Аллаха и в Последний день, пусть оказывает уважение гостю». (аль-Бухари, Муслим)"]], "q": [["Чего желать брату?", ["Того же, что и себе", "Меньшего", "Ничего"], 0, "Хадис № 13."], ["Нечего сказать хорошего. Что делать?", ["Промолчать", "Сказать всё равно", "Пошутить над кем-то"], 0, "Хадис № 15."], ["Кого велено уважать в хадисе № 15?", ["Соседа и гостя", "Только богатых", "Только себя"], 0, "Хадис № 15."]]}, {"t": "Гнев и ихсан", "ic": "🌊", "tip": "Хадисы № 16–18 из сборника имама ан-Навави.", "c": [["🌊", "Хадис № 16", "Человек попросил: «Дай мне совет». Пророк ﷺ сказал: «Не гневайся». Тот повторил просьбу несколько раз, и каждый раз он отвечал: «Не гневайся». (аль-Бухари)"], ["✨", "Хадис № 17", "«Поистине, Аллах предписал совершенство (ихсан) во всём». Даже с животными нужно обращаться бережно и мягко. (Муслим)"], ["🛡", "Хадис № 18", "«Бойся Аллаха, где бы ты ни был. Вслед за плохим поступком соверши хороший — он сотрёт его. И относись к людям с хорошим нравом». (ат-Тирмизи)"]], "q": [["Какой совет Пророк ﷺ повторил несколько раз?", ["«Не гневайся»", "«Спеши»", "«Молчи»"], 0, "Хадис № 16."], ["Что Аллах предписал во всём?", ["Совершенство (ихсан)", "Спешку", "Строгость"], 0, "Хадис № 17."], ["Как стереть плохой поступок?", ["Сделать после него хороший", "Скрыть его", "Забыть о нём"], 0, "Хадис № 18."]]}, {"t": "Береги Аллаха", "ic": "🧒", "tip": "Хадисы № 19–22 из сборника имама ан-Навави.", "c": [["🧒", "Хадис № 19", "Пророк ﷺ сказал мальчику Ибн Аббасу: «Береги Аллаха — и Он сбережёт тебя. Береги Аллаха — и найдёшь Его перед собой. Если просишь — проси Аллаха, если ищешь помощи — ищи её у Аллаха. Знай: если все люди соберутся, чтобы принести тебе пользу, они принесут её только в том, что Аллах тебе предписал». (ат-Тирмизи)"], ["😳", "Хадис № 20", "«Из слов первых пророков, дошедших до людей: если не стыдишься — делай что хочешь». (Смысл: стыдливость удерживает от плохого.) (аль-Бухари)"], ["🏔", "Хадис № 21", "Человек попросил: «Скажи мне об исламе то, о чём я больше никого не спрошу». Пророк ﷺ ответил: «Скажи: уверовал я в Аллаха, — а затем будь стойким». (Муслим)"], ["🚪", "Хадис № 22", "Человек спросил: «Если я буду совершать обязательные намазы, поститься в Рамадан, считать дозволенное дозволенным, а запретное запретным и ничего больше не добавлю — войду ли я в Рай?» Пророк ﷺ ответил: «Да». (Муслим)"]], "q": [["Кому Пророк ﷺ сказал «Береги Аллаха»?", ["Мальчику Ибн Аббасу", "Царю", "Купцу"], 0, "Хадис № 19."], ["Если все люди соберутся помочь тебе, они помогут…", ["только в том, что предписал Аллах", "во всём", "ни в чём"], 0, "Хадис № 19."], ["Что удерживает от плохого (хадис № 20)?", ["Стыдливость", "Богатство", "Сила"], 0, "«Если не стыдишься — делай что хочешь»."], ["Что сказать об исламе одной фразой (хадис № 21)?", ["«Уверовал я в Аллаха» — и быть стойким", "«Я сильный»", "«Я всё знаю»"], 0, "Хадис № 21."]]}, {"t": "Чистота и садака", "ic": "💧", "tip": "Хадисы № 23–25 из сборника имама ан-Навави.", "c": [["💧", "Хадис № 23", "«Чистота — половина веры. Слова «Альхамдулиллях» наполняют весы… Намаз — свет, садака — доказательство, терпение — сияние, а Коран — довод за тебя или против тебя». (Муслим)"], ["🌟", "Хадис № 24", "Аллах сказал (хадис кудси): «О рабы Мои! Я запретил несправедливость Себе и сделал её запретной между вами — так не притесняйте же друг друга… О рабы Мои! Все вы заблудшие, кроме тех, кого Я наставил, — так просите Меня о верном пути, и Я наставлю вас». (Муслим, часть)"], ["📿", "Хадис № 25", "Бедные сподвижники пожаловались, что богатые могут давать садака. Пророк ﷺ сказал: «Каждый тасбих — садака, каждый такбир — садака, каждое «Альхамдулиллях» — садака, каждое «Ля иляха илляЛлах» — садака, призыв к доброму — садака, удержание от плохого — садака». (Муслим)"]], "q": [["Чистота — это…", ["половина веры", "мелочь", "только для взрослых"], 0, "Хадис № 23."], ["Намаз — это…", ["свет", "тяжесть", "игра"], 0, "Хадис № 23."], ["Что Аллах запретил Себе и людям (хадис кудси № 24)?", ["Несправедливость", "Сон", "Еду"], 0, "Хадис № 24."], ["Каждое «СубханАллах» — это…", ["садака", "ничего", "долг"], 0, "Хадис № 25."]]}, {"t": "Нрав и наставление", "ic": "🦴", "tip": "Хадисы № 26–28 из сборника имама ан-Навави.", "c": [["🦴", "Хадис № 26", "«За каждый сустав человека каждый день полагается садака: рассудить двоих по справедливости — садака, помочь человеку сесть верхом или поднять поклажу — садака, доброе слово — садака, каждый шаг к намазу — садака, убрать с дороги то, что мешает, — садака». (аль-Бухари, Муслим)"], ["💚", "Хадис № 27", "«Благочестие — это хороший нрав, а грех — то, что тревожит твою душу и о чём ты не хотел бы, чтобы узнали люди». (Муслим)"], ["📜", "Хадис № 28", "Пророк ﷺ дал наставление, от которого задрожали сердца: «Завещаю вам бояться Аллаха, слушаться и повиноваться… Придерживайтесь моей сунны и сунны праведных халифов, держитесь её крепко и остерегайтесь новшеств в религии». (Абу Дауд, ат-Тирмизи)"]], "q": [["Убрать камень с дороги — это…", ["садака", "пустяк", "обязанность только взрослых"], 0, "Хадис № 26."], ["Благочестие — это…", ["хороший нрав", "много денег", "громкий голос"], 0, "Хадис № 27."], ["Грех — это то, что…", ["тревожит душу и что стыдно показать людям", "нравится всем", "полезно"], 0, "Хадис № 27."], ["Чего остерегаться в религии (хадис № 28)?", ["Новшеств", "Сунны", "Намаза"], 0, "Хадис № 28."]]}, {"t": "Язык и границы", "ic": "🗝", "tip": "Хадисы № 29–31 из сборника имама ан-Навави.", "c": [["🗝", "Хадис № 29", "Муаз спросил о деле, которое введёт его в Рай. Пророк ﷺ ответил: «Поклоняйся Аллаху и не придавай Ему сотоварищей, совершай намаз, давай закят, постись в Рамадан и соверши хадж». А затем, взявшись за свой язык, сказал: «Удерживай это». (ат-Тирмизи)"], ["🧭", "Хадис № 30", "«Аллах установил обязанности — не пренебрегайте ими, установил границы — не преступайте их, запретил вещи — не нарушайте запретов, а о некоторых вещах умолчал по милости к вам, а не по забывчивости — не допытывайтесь о них». (ад-Даракутни)"], ["🍃", "Хадис № 31", "«Будь равнодушен к этому миру — и тебя полюбит Аллах, будь равнодушен к тому, что есть у людей, — и тебя полюбят люди». (Ибн Маджа)"]], "q": [["За что взялся Пророк ﷺ, сказав «Удерживай это»?", ["За язык", "За руку", "За сердце"], 0, "Хадис № 29."], ["Как поступать с тем, о чём Аллах умолчал?", ["Не допытываться", "Спорить", "Придумывать правила"], 0, "Хадис № 30."], ["Что сделает так, что тебя полюбят люди?", ["Не зариться на то, что у них есть", "Хвастаться", "Просить у всех"], 0, "Хадис № 31."]]}, {"t": "Не вреди и помогай", "ic": "🚧", "tip": "Хадисы № 32–36 из сборника имама ан-Навави.", "c": [["🚧", "Хадис № 32", "«Не причиняй вреда и не отвечай вредом». (Ибн Маджа)"], ["⚖️", "Хадис № 33", "«Если бы людям давали всё только по их словам, одни стали бы требовать чужое имущество и кровь. Но доказательство — на том, кто требует, а клятва — на том, кто отрицает». (аль-Байхаки)"], ["✋", "Хадис № 34", "«Кто из вас увидит плохое, пусть изменит его рукой; если не может — языком; если не может — сердцем, и это самая слабая вера». (Муслим)"], ["👬", "Хадис № 35", "«Не завидуйте друг другу, не обманывайте в торговле, не питайте ненависти, не отворачивайтесь друг от друга… Будьте, рабы Аллаха, братьями! Мусульманин — брат мусульманину: не притесняет его, не оставляет без помощи, не лжёт ему и не презирает его. Богобоязненность — здесь», — и он трижды указал на грудь. (Муслим)"], ["🫶", "Хадис № 36", "«Кто избавит верующего от беды этого мира, того Аллах избавит от беды Судного дня… Аллах помогает рабу, пока раб помогает своему брату. Кто встал на путь поиска знания, тому Аллах облегчит путь в Рай». (Муслим)"]], "q": [["«Не причиняй вреда и…»", ["не отвечай вредом", "не молчи", "не помогай"], 0, "Хадис № 32."], ["Увидел плохое и не можешь изменить рукой. Что дальше?", ["Сказать словами, а если нельзя — не одобрять сердцем", "Присоединиться", "Посмеяться"], 0, "Хадис № 34."], ["Мусульманин для мусульманина — …", ["брат", "чужой", "соперник"], 0, "Хадис № 35."], ["Кому Аллах облегчит путь в Рай?", ["Тому, кто ищет знание", "Тому, кто много спит", "Тому, кто хвастается"], 0, "Хадис № 36."]]}, {"t": "Добрые дела и прощение", "ic": "➕", "tip": "Хадисы № 37–42 из сборника имама ан-Навави.", "c": [["➕", "Хадис № 37", "«Кто решил сделать доброе дело, но не сделал его, — Аллах запишет ему полное доброе дело; а если решил и сделал — запишет от десяти до семисот раз и больше. А кто решил сделать плохое, но не сделал, — Аллах запишет ему полное доброе дело». (аль-Бухари, Муслим)"], ["💞", "Хадис № 38", "Аллах сказал (хадис кудси): «Раб Мой приближается ко Мне больше всего тем, что Я сделал обязательным, и продолжает приближаться ко Мне дополнительными делами, пока Я не полюблю его…» (аль-Бухари, часть)"], ["🕊", "Хадис № 39", "«Поистине, Аллах простил моей общине ошибку, забывчивость и то, к чему их принудили». (Ибн Маджа)"], ["🧳", "Хадис № 40", "«Будь в этом мире словно чужеземец или путник». (аль-Бухари)"], ["🧡", "Хадис № 41", "«Не уверует никто из вас по-настоящему, пока его желания не будут следовать тому, с чем я пришёл». (ан-Навави назвал его хорошим)"], ["🌧", "Хадис № 42", "Аллах сказал (хадис кудси): «О сын Адама! Пока ты взываешь ко Мне и надеешься на Меня, Я прощаю тебе… Если бы твои грехи достигли облаков на небе, а потом ты попросил у Меня прощения — Я простил бы тебя». (ат-Тирмизи)"]], "q": [["Решил сделать доброе, но не успел. Что запишут?", ["Полное доброе дело", "Ничего", "Плохое дело"], 0, "Хадис № 37."], ["Чем раб больше всего приближается к Аллаху?", ["Обязательными делами", "Хвастовством", "Сном"], 0, "Хадис № 38."], ["Что Аллах простил общине?", ["Ошибку, забывчивость и принуждение", "Всё специально сделанное", "Ничего"], 0, "Хадис № 39."], ["Каким быть в этом мире?", ["Словно путник", "Словно царь", "Словно хозяин навсегда"], 0, "Хадис № 40."]]}]};

/* ================= праздник при новом звании ================= */
function seenOf(s){return{lv:lvl(s)[0],names:earned(s).map(function(b){return b.n})}}
function checkCeleb(){
  var s=meStudent&&S&&by(meStudent);if(!s)return;
  var key="seen_"+G.slug+"_"+s.id,seen=store.get(key,null),cur=seenOf(s);store.set(key,cur);
  if(!seen||!seen.names)return;
  var fresh=earned(s).filter(function(b){return b.k!=="l"&&seen.names.indexOf(b.n)<0});
  if(cur.lv>seen.lv||fresh.length){celeb={id:s.id,lv:cur.lv>seen.lv,b:fresh.length?fresh.slice(0,3):null};render();confetti()}
}
function confetti(){
  try{if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return}catch(e){}
  var c=document.createElement("canvas");c.id="fx";document.body.appendChild(c);var x=c.getContext("2d"),W=c.width=innerWidth,H=c.height=innerHeight,P=[],cols=["#fbbf24","#5eead4","#93b4ff","#c4b5fd","#fda4af","#ffffff"];
  for(var i=0;i<140;i++)P.push({x:W/2+(Math.random()-.5)*80,y:H*.45,vx:(Math.random()-.5)*13,vy:-Math.random()*14-4,r:Math.random()*6+3,c:cols[i%cols.length],a:Math.random()*6});
  var t0=performance.now();(function f(t){x.clearRect(0,0,W,H);P.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(t-t0<2600)requestAnimationFrame(f);else c.remove()})(t0);
}
